[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robotics-lab"
version = "0.0.1"
description = "ROS 2 and CAN bus tools, plus re-implementations of robotics papers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Modelshifts", email = "info@modelshifts.com" }]
dependencies = ["python-can>=4", "cantools>=39"]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]

[project.urls]
Homepage = "https://modelshifts.com/work"
Repository = "https://github.com/ModelShifts/robotics-lab"

[project.scripts]
robotics-lab = "robotics_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/robotics_lab"]
