name: CI

on:
  push:
    branches: [main, v1]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Samples are reproducible
        run: |
          python scripts/make_samples.py
          git diff --exit-code -- samples/
      - name: Tests
        run: pytest -q
      - name: Evaluation against the generator settings
        run: python scripts/evaluate.py
      - name: CLI smoke test
        run: |
          robotics-lab --version
          robotics-lab ros analyze samples/ros/node_graph
          robotics-lab can analyze samples/can/trace.csv --dbc samples/can/robot.dbc
          robotics-lab papers list
          robotics-lab papers dmp
          robotics-lab can log --interface socketcan --channel vcan-does-not-exist --seconds 0.1 --out /tmp/can-missing || test $? -eq 2
